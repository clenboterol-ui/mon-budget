<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon budget du mois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan : une colonne type appli (480px max), résumé en haut, bouton d'ajout collé en bas. */
:root{
--bg:#eef3ee; --surface:#ffffff; --ink:#15211a; --muted:#5d6b62; --line:#dde5de;
--accent:#0d7a49; --accent-ink:#ffffff; --hero:#0d7a49; --hero-over:#b3261e;
--good:#0d7a49; --bad:#b3261e; --warn:#a15c00; --chip:#e6ede7;
--display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0e1411; --surface:#18211c; --ink:#e9f0ea; --muted:#98a69c; --line:#2a352e;
--accent:#43c98a; --accent-ink:#06150d; --hero:#12633f; --hero-over:#8f2620;
--good:#55d596; --bad:#ff8a80; --warn:#f0b354; --chip:#222d26; color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#0e1411; --surface:#18211c; --ink:#e9f0ea; --muted:#98a69c; --line:#2a352e;
--accent:#43c98a; --accent-ink:#06150d; --hero:#12633f; --hero-over:#8f2620;
--good:#55d596; --bad:#ff8a80; --warn:#f0b354; --chip:#222d26; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:16px 16px 110px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;min-width:9.5em;text-align:center;text-transform:capitalize}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 12px}
.syncbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.syncbar b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.syncbar button{border:0;background:var(--chip);border-radius:8px;font-size:13px;font-weight:600;padding:6px 10px;white-space:nowrap}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:22px 20px;text-align:center}
.hero.over{background:var(--hero-over)}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,13vw,56px);line-height:1.05;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:14px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:500;color:var(--muted);font-size:13px}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 6px;border-radius:10px}
.cat:hover,.cat[aria-pressed="true"]{background:var(--chip)}
.dot{width:12px;height:12px;border-radius:4px;background:var(--c)}
.cat .name{font-weight:600}
.cat .amt{font-weight:700;font-variant-numeric:tabular-nums}
.cat .bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--chip);overflow:hidden;display:flex}
.cat .bar i{display:block;height:100%;background:var(--c)}
.cat .bar i.due{opacity:.4}
.cat .meta{grid-column:2/4;font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 6px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--muted)}
.row .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row .a.in{color:var(--good)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--chip);color:var(--warn)}
.badge.ok{color:var(--good)}
.badge.late{color:var(--bad)}
.pay{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12px;font-weight:600;padding:4px 8px;margin-top:4px}
.empty{color:var(--muted);font-size:14px;padding:6px}
.clear{border:0;background:var(--chip);border-radius:8px;font-size:12px;font-weight:600;padding:4px 8px}
.add{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center}
.add button{width:100%;max-width:448px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:15px}
.add button:disabled{opacity:.55;cursor:default}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{color:var(--muted);font-weight:600;text-transform:capitalize}
tr.sum td{font-weight:700}
td.z{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%}
#f-amount{font-family:var(--display);font-weight:800;font-size:34px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px}
.actions .save{flex:1;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px}
.actions .del{border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--bad);font-weight:600;padding:14px}
.err{color:var(--bad);font-size:13px;min-height:1em}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main class="app">
<div class="top">
<div class="month">
<button class="icon-btn" id="prev" aria-label="Mois précédent">‹</button>
<h1 id="title">…</h1>
<button class="icon-btn" id="next" aria-label="Mois suivant">›</button>
</div>
<div class="tabs" role="tablist">
<button role="tab" id="tab-month" aria-selected="true">Mois</button>
<button role="tab" id="tab-year" aria-selected="false">Année</button>
</div>
</div>
<div id="syncbar" class="syncbar" hidden></div>
<div id="note" class="note" hidden></div>
<div id="view"></div>
</main>
<div class="add"><button id="add" disabled>Chargement…</button></div>
<div class="overlay" id="overlay" hidden>
<form class="sheet" id="form" autocomplete="off">
<h2><span id="f-title">Nouvelle dépense</span><button type="button" class="icon-btn" id="f-close" aria-label="Fermer">×</button></h2>
<div class="seg" id="f-kind">
<button type="button" data-k="d">Dépense</button>
<button type="button" data-k="r">Revenu</button>
<button type="button" data-k="p">À venir</button>
</div>
<div class="field"><label for="f-amount">Montant (€)</label><input id="f-amount" inputmode="decimal" placeholder="0,00"></div>
<div class="field"><span class="lab" id="f-cat-lab">Catégorie</span><div class="chips" id="f-cats"></div></div>
<div class="two">
<div class="field"><label for="f-label">Description (facultatif)</label><input id="f-label" maxlength="60" placeholder="ex. Courses de la semaine"></div>
<div class="field"><label for="f-date" id="f-date-lab">Date</label><input id="f-date" type="date"></div>
</div>
<div class="err" id="f-err" role="alert"></div>
<div class="actions">
<button type="button" class="del" id="f-del" hidden>Supprimer</button>
<button type="submit" class="save" id="f-save">Enregistrer</button>
</div>
</form>
</div>
<div class="overlay" id="acct-ov" hidden>
<form class="sheet" id="acct-form">
<h2><span>Synchroniser mes appareils</span><button type="button" class="icon-btn" id="a-close" aria-label="Fermer">×</button></h2>
<p class="empty" style="margin:0;padding:0">Créez un compte une fois, puis connectez-vous avec le même e-mail sur le téléphone et sur l'ordinateur : le budget sera le même partout.</p>
<div class="field"><label for="a-email">E-mail</label><input id="a-email" type="email" autocomplete="email"></div>
<div class="field"><label for="a-pass">Mot de passe (6 caractères minimum)</label><input id="a-pass" type="password" autocomplete="current-password"></div>
<div class="err" id="a-err" role="alert"></div>
<div class="actions">
<button type="button" class="del" id="a-signup" style="color:var(--ink)">Créer un compte</button>
<button type="submit" class="save" id="a-login">Se connecter</button>
</div>
</form>
</div>
<script>
"use strict";
const CATS = [
["Courses","#2f9e5b"],["Loisirs","#7c5cd6"],["Plaisirs","#d6498f"],["Plaisirs alimentaires","#e07a2f"],
["Shopping","#c2459b"],["Shopping nécessaire","#3f7fd9"],["Logement","#2b6cb0"],["Transport","#1f9aa0"],
["Abonnements","#b7791f"],["Santé","#d04a4a"],["Autre","#7b857e"]
];
const INCOME = [["Salaire","#2f9e5b"],["Prime","#1f9aa0"],["Remboursement","#3f7fd9"],["Autre","#7b857e"]];
const colorOf = (name, list) => (list.find(c => c[0] === name) || [0, "#7b857e"])[1];
const eur = new Intl.NumberFormat("fr-FR", {style:"currency", currency:"EUR"});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const ymOf = s => s.slice(0, 7);
const monthName = (ym, opt) => new Date(+ym.slice(0,4), +ym.slice(5,7) - 1, 1).toLocaleDateString("fr-FR", opt || {month:"long", year:"numeric"});
const shift = (ym, n) => { const d = new Date(+ym.slice(0,4), +ym.slice(5,7) - 1 + n, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
/* ---------- calcul (fonction pure) ---------- */
function compute(items) {
const r = {rev:0, spent:0, due:0, cats:{}};
for (const it of items) {
if (it.k === "r") { r.rev += it.a; continue; }
const c = r.cats[it.c] || (r.cats[it.c] = {spent:0, due:0, n:0});
c.n++;
if (it.k === "p" && !it.p) { r.due += it.a; c.due += it.a; } else { r.spent += it.a; c.spent += it.a; }
}
r.left = r.rev - r.spent - r.due;
return r;
}
/* Report : ce qui restait (ou manquait) à la fin de tous les mois précédents. */
function carryInto(ym, months) {
let c = 0;
for (const m in months) if (m < ym) c += compute(months[m] || []).left;
return Math.round(c * 100) / 100;
}
/* ---------- état ---------- */
const S = {months:{}, ym:ymOf(today()), tab:"month", filter:null, mode:"loading", demo:false, edit:null, kind:"d", cat:null};
function demoItems() {
const m = ymOf(today()), d = n => m + "-" + pad(n);
return [
{id:"x1",k:"r",d:d(2),t:"Salaire",c:"Salaire",a:1850},
{id:"x2",k:"p",d:d(5),t:"Loyer",c:"Logement",a:620,p:true},
{id:"x3",k:"d",d:d(3),t:"Courses de la semaine",c:"Courses",a:54.3},
{id:"x4",k:"d",d:d(8),t:"Courses de la semaine",c:"Courses",a:47.85},
{id:"x5",k:"d",d:d(6),t:"Cinéma",c:"Loisirs",a:11.5},
{id:"x6",k:"d",d:d(9),t:"Pâtisserie",c:"Plaisirs alimentaires",a:8.4},
{id:"x7",k:"d",d:d(5),t:"Plein d'essence",c:"Transport",a:62},
{id:"x8",k:"p",d:d(25),t:"Facture d'électricité",c:"Logement",a:62,p:false}
];
}
const isEmpty = () => !Object.values(S.months).some(a => a && a.length);
const itemsOf = ym => (S.demo && ym === ymOf(today())) ? demoItems() : (S.months[ym] || []);
/* ---------- enregistrement ---------- */
const LS = "mon-budget-v1";
let col = null; const queue = {};
function loadLocal() { try { return JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { return {}; } }
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(S.months)); } catch (e) {} }
function toLocal() { S.mode = "local"; col = null; saveLocal(); render(); }
function save(ym) {
if (S.mode === "local") { saveLocal(); if (sess) { markDirty(ym); sync(); } return; }
if (S.mode !== "cloud") return;
const body = {items: JSON.parse(JSON.stringify(S.months[ym] || []))};
queue[ym] = (queue[ym] || Promise.resolve()).then(() => col.doc(ym).set(body)).catch(() => { if (S.mode === "cloud") toLocal(); });
}
/* ---------- synchronisation entre appareils (Supabase) ---------- */
const SB = {url:"https://vkgqdrlzbusmsbdvgqrt.supabase.co", key:"sb_publishable_DSKRHRfMcATFuqxch3j5Hw_5W8CN4j2"};
const LS_SESS = "mon-budget-session", LS_DIRTY = "mon-budget-a-envoyer";
const CAN_SYNC = !(window.claude && window.claude.use);
let sess = null, dirty = new Set(), syncing = null;
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function setSess(j, email) { sess = j ? {at:j.access_token, rt:j.refresh_token, exp:Date.now() + ((j.expires_in || 3600) - 60) * 1000, email:(j.user && j.user.email) || email || ""} : null; lsSet(LS_SESS, sess); }
async function sbAuth(path, body) {
const r = await fetch(SB.url + "/auth/v1/" + path, {method:"POST", headers:{apikey:SB.key, "Content-Type":"application/json"}, body:JSON.stringify(body)});
const j = await r.json().catch(() => ({}));
if (!r.ok) { const e = new Error(j.msg || j.error_description || j.message || "Erreur"); e.code = j.error_code || j.code || r.status; throw e; }
return j;
}
async function token() {
if (Date.now() > sess.exp) {
try { setSess(await sbAuth("token?grant_type=refresh_token", {refresh_token:sess.rt}), sess.email); }
catch (e) { if (e.code && e.code !== 0 && String(e.code) !== "429" && !(e instanceof TypeError)) { setSess(null); render(); } throw e; }
}
return sess.at;
}
async function sbRest(method, query, body) {
const t = await token();
const r = await fetch(SB.url + "/rest/v1/budget_months" + query, {method, headers:{apikey:SB.key, Authorization:"Bearer " + t, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal"}, body:body ? JSON.stringify(body) : undefined});
if (!r.ok) throw new Error("HTTP " + r.status);
return method === "GET" ? r.json() : null;
}
const push = ym => sbRest("POST", "?on_conflict=user_id,ym", {ym, items:S.months[ym] || [], updated_at:new Date().toISOString()});
function markDirty(ym) { dirty.add(ym); lsSet(LS_DIRTY, [...dirty]); }
/* Envoie ce qui attend, puis reprend l'état du serveur. Une seule synchro à la fois. */
function sync() {
if (!sess) return Promise.resolve();
if (syncing) return syncing;
syncing = (async () => {
try {
for (const ym of [...dirty]) { await push(ym); dirty.delete(ym); lsSet(LS_DIRTY, [...dirty]); }
const rows = await sbRest("GET", "?select=ym,items");
if (!dirty.size) { const m = {}; for (const r of rows) m[r.ym] = Array.isArray(r.items) ? r.items : []; S.months = m; saveLocal(); S.demo = isEmpty(); }
S.offline = false;
} catch (e) { S.offline = true; }
syncing = null; render();
if (dirty.size && !S.offline) sync();
})();
return syncing;
}
async function login(email, password, create) {
if (create) {
const j = await sbAuth("signup", {email, password});
if (!j.access_token) return "confirm";
setSess(j, email);
} else setSess(await sbAuth("token?grant_type=password", {email, password}), email);
/* première connexion sur cet appareil : on fusionne ce qui y était déjà saisi */
const local = S.demo ? {} : S.months, rows = await sbRest("GET", "?select=ym,items"), merged = {};
for (const r of rows) merged[r.ym] = Array.isArray(r.items) ? r.items : [];
for (const ym in local) {
const have = new Set((merged[ym] || []).map(x => x.id)), extra = (local[ym] || []).filter(x => !have.has(x.id));
if (extra.length) { merged[ym] = (merged[ym] || []).concat(extra); dirty.add(ym); }
}
S.months = merged; S.demo = isEmpty(); lsSet(LS_DIRTY, [...dirty]); saveLocal();
await sync();
return "ok";
}
function logout() { setSess(null); dirty = new Set(); lsSet(LS_DIRTY, null); S.months = {}; saveLocal(); S.demo = true; S.offline = false; render(); }
function authMessage(e) {
const c = String(e.code || ""), m = (e.message || "").toLowerCase();
if (e instanceof TypeError) return "Pas de connexion internet.";
if (c === "invalid_credentials" || m.includes("invalid login")) return "E-mail ou mot de passe incorrect.";
if (c === "email_not_confirmed" || m.includes("not confirmed")) return "Confirmez d'abord votre e-mail avec le lien reçu, puis reconnectez-vous.";
if (c === "user_already_exists" || m.includes("already registered")) return "Un compte existe déjà avec cet e-mail : utilisez « Se connecter ».";
if (c === "weak_password" || m.includes("password")) return "Mot de passe trop court : 6 caractères minimum.";
if (c === "429" || c.includes("rate_limit")) return "Trop d'essais. Réessayez dans quelques minutes.";
return "Ça n'a pas marché : " + (e.message || "erreur inconnue");
}
async function boot() {
let db = null, user = null, uid = null;
try { if (window.claude && window.claude.use) [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
try { uid = user ? await user.id() : null; } catch (e) {}
if (!db || !uid) { S.months = loadLocal(); S.mode = "local"; S.demo = isEmpty(); if (CAN_SYNC) { sess = lsGet(LS_SESS, null); dirty = new Set(lsGet(LS_DIRTY, [])); } render(); if (sess) sync(); return; }
try { col = db.doc("data/users/" + uid + "/budget").collection("months"); } catch (e) { S.months = loadLocal(); S.mode = "local"; S.demo = isEmpty(); render(); return; }
let first = true;
const slow = setTimeout(() => { if (first) { S.slow = true; render(); } }, 10000);
col.onSnapshot(snap => {
const m = {};
for (const d of snap.docs) { const b = d.data(); m[d.id] = (b && Array.isArray(b.items)) ? b.items.map(x => Object.assign({}, x)) : []; }
S.months = m;
if (first || !snap.metadata.fromCache) { clearTimeout(slow); S.slow = false; }
if (first) { first = false; S.mode = "cloud"; S.demo = isEmpty(); }
render();
}, () => { clearTimeout(slow); S.slow = false; S.months = loadLocal(); S.mode = "local"; S.demo = isEmpty(); render(); });
}
/* ---------- affichage ---------- */
const $ = id => document.getElementById(id);
function render() {
$("title").textContent = S.tab === "year" ? S.ym.slice(0, 4) : monthName(S.ym);
$("tab-month").setAttribute("aria-selected", S.tab === "month");
$("tab-year").setAttribute("aria-selected", S.tab === "year");
const add = $("add"); add.disabled = S.mode === "loading"; add.textContent = S.mode === "loading" ? "Chargement…" : "+ Ajouter";
const notes = [];
if (S.demo) notes.push("Exemples pour montrer le principe. Ils disparaissent dès votre première saisie.");
if (S.mode === "local" && !sess) notes.push("Vos saisies sont gardées sur cet appareil uniquement.");
if (sess && S.offline) notes.push("Pas de connexion : vos modifications sont gardées ici et partiront au retour d'internet.");
const bar = $("syncbar");
bar.hidden = !(CAN_SYNC && S.mode === "local");
bar.innerHTML = sess ? `<span>${S.offline ? "Hors ligne" : "Synchronisé"} · <b>${esc(sess.email)}</b></span><button id="logout">Se déconnecter</button>`
: `<span>Même budget sur téléphone et ordinateur</span><button id="open-acct">Synchroniser</button>`;
if (S.slow) notes.push("Vos données n'ont pas encore pu être chargées.");
$("note").hidden = !notes.length; $("note").textContent = notes.join(" ");
$("view").innerHTML = S.tab === "year" ? yearView() : monthView();
}
function monthView() {
const items = itemsOf(S.ym), r = compute(items), cur = S.ym === ymOf(today());
const carry = S.demo ? 0 : carryInto(S.ym, S.months), left = r.left + carry;
let sub = "";
if (left < 0) sub = "Budget dépassé de " + eur.format(-left);
else if (cur) { const n = new Date(), last = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate(), days = last - n.getDate() + 1; sub = "soit " + eur.format(left / days) + " par jour jusqu'à la fin du mois"; }
else sub = "report compris, moins les dépenses et les dépenses à venir";
const total = r.spent + r.due;
const cats = CATS.map(c => c[0]).concat(Object.keys(r.cats).filter(k => !CATS.some(c => c[0] === k)))
.map(name => ({name, v: r.cats[name] || {spent:0, due:0, n:0}})).filter(c => c.v.n > 0)
.sort((a, b) => (b.v.spent + b.v.due) - (a.v.spent + a.v.due));
const max = Math.max(1, ...cats.map(c => c.v.spent + c.v.due));
const catHtml = cats.length ? cats.map(c => {
const t = c.v.spent + c.v.due;
return `<button class="cat" style="--c:${colorOf(c.name, CATS)}" data-cat="${esc(c.name)}" aria-pressed="${S.filter === c.name}">
<span class="dot"></span><span class="name">${esc(c.name)}</span><span class="amt">${eur.format(t)}</span>
<span class="bar"><i style="width:${100 * c.v.spent / max}%"></i><i class="due" style="width:${100 * c.v.due / max}%"></i></span>
<span class="meta">${c.v.n} ligne${c.v.n > 1 ? "s" : ""} · ${total ? Math.round(100 * t / total) : 0} % du mois${c.v.due ? " · dont " + eur.format(c.v.due) + " à venir" : ""}</span></button>`;
}).join("") : `<div class="empty">Aucune dépense ce mois-ci.</div>`;
const list = items.filter(it => !S.filter || (it.k !== "r" && it.c === S.filter)).sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0);
const rows = list.length ? list.map(it => {
const inc = it.k === "r", c = colorOf(it.c, inc ? INCOME : CATS), dt = new Date(it.d + "T12:00:00").toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
let badge = "", pay = "";
if (it.k === "p") {
if (it.p) badge = `<span class="badge ok">payé</span>`;
else { badge = it.d < today() ? `<span class="badge late">en retard</span>` : `<span class="badge">à venir</span>`; pay = `<br><span class="pay" data-pay="${esc(it.id)}" role="button" tabindex="0">Marquer payé</span>`; }
}
return `<button class="row" data-id="${esc(it.id)}" style="--c:${c}"><span class="dot"></span>
<span><span class="t">${esc(it.t || it.c)}</span>${badge}<br><span class="s">${dt} · ${esc(it.c)}</span>${pay}</span>
<span class="a${inc ? " in" : ""}">${inc ? "+" : "−"} ${eur.format(it.a)}</span></button>`;
}).join("") : `<div class="empty">Rien pour l'instant. Touchez « + Ajouter ».</div>`;
return `<div style="display:flex;flex-direction:column;gap:14px">
<section class="hero${left < 0 ? " over" : ""}"><div class="lbl">${left < 0 ? "Budget dépassé" : "Reste à dépenser"}</div><div class="big">${eur.format(left)}</div><div class="sub">${sub}</div></section>
<section class="stats"><div class="stat"><div class="k">Revenus</div><div class="v">${eur.format(r.rev)}</div></div><div class="stat"><div class="k">${carry < 0 ? "Manque reporté" : "Économies reportées"}</div><div class="v" style="color:var(${carry < 0 ? "--bad" : "--good"})">${carry > 0 ? "+ " : ""}${eur.format(carry)}</div></div><div class="stat"><div class="k">Dépensé</div><div class="v">${eur.format(r.spent)}</div></div><div class="stat"><div class="k">À venir</div><div class="v">${eur.format(r.due)}</div></div></section>
<section class="card"><h2>Total par catégorie <small>${eur.format(total)}</small></h2>${catHtml}</section>
<section class="card"><h2>${S.filter ? esc(S.filter) : "Tout le mois"}${S.filter ? `<button class="clear" id="clear">Tout afficher ×</button>` : ""}</h2><div class="rows">${rows}</div></section></div>`;
}
function yearView() {
const y = S.ym.slice(0, 4), ms = Array.from({length:12}, (_, i) => y + "-" + pad(i + 1)), rs = ms.map(m => compute(itemsOf(m)));
const cell = v => `<td${v ? "" : ' class="z"'}>${v ? eur.format(v) : "–"}</td>`;
const used = CATS.map(c => c[0]).concat([...new Set(rs.flatMap(r => Object.keys(r.cats)))].filter(k => !CATS.some(c => c[0] === k)));
const line = (label, vals, cls) => `<tr${cls ? ` class="${cls}"` : ""}><td>${label}</td>${vals.map(cell).join("")}${cell(vals.reduce((a, b) => a + b, 0))}</tr>`;
const body = used.map(name => line(`<span class="dot" style="--c:${colorOf(name, CATS)};display:inline-block;margin-right:6px"></span>${esc(name)}`, rs.map(r => { const c = r.cats[name]; return c ? c.spent + c.due : 0; }))).join("");
return `<section class="card"><h2>Chaque catégorie, mois par mois</h2><div class="tablewrap"><table>
<thead><tr><th>Catégorie</th>${ms.map(m => `<th>${monthName(m, {month:"short"})}</th>`).join("")}<th>Année</th></tr></thead>
<tbody>${body}${line("Total dépenses", rs.map(r => r.spent + r.due), "sum")}${line("Revenus", rs.map(r => r.rev), "sum")}${line("Reste du mois", rs.map(r => r.left), "sum")}<tr class="sum"><td>Reste cumulé</td>${ms.map(m => cell(S.demo ? compute(itemsOf(m)).left : carryInto(shift(m, 1), S.months))).join("")}<td></td></tr></tbody></table></div></section>`;
}
/* ---------- formulaire ---------- */
function openForm(it) {
S.edit = it || null; S.kind = it ? it.k : "d"; S.cat = it ? it.c : null;
$("f-amount").value = it ? String(it.a).replace(".", ",") : "";
$("f-label").value = it ? (it.t || "") : "";
$("f-date").value = it ? it.d : (S.ym === ymOf(today()) ? today() : S.ym + "-01");
$("f-del").hidden = !it; $("f-err").textContent = "";
drawForm(); $("overlay").hidden = false;
if (!it) setTimeout(() => $("f-amount").focus(), 50);
}
function drawForm() {
const T = {d:["Nouvelle dépense","Modifier la dépense"], r:["Nouveau revenu","Modifier le revenu"], p:["Nouvelle dépense à venir","Modifier la dépense à venir"]};
$("f-title").textContent = T[S.kind][S.edit ? 1 : 0];
document.querySelectorAll("#f-kind button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === S.kind));
const list = S.kind === "r" ? INCOME : CATS;
if (!list.some(c => c[0] === S.cat)) S.cat = S.kind === "r" ? "Salaire" : null;
$("f-cat-lab").textContent = S.kind === "r" ? "Type de revenu" : "Catégorie";
$("f-date-lab").textContent = S.kind === "p" ? "Échéance" : "Date";
$("f-cats").innerHTML = list.map(c => `<button type="button" data-c="${esc(c[0])}" aria-pressed="${S.cat === c[0]}"><span class="dot" style="--c:${c[1]}"></span>${esc(c[0])}</button>`).join("");
}
function closeForm() { $("overlay").hidden = true; S.edit = null; }
function removeItem(id) { for (const ym in S.months) { const a = S.months[ym], i = a.findIndex(x => x.id === id); if (i >= 0) { a.splice(i, 1); return ym; } } return null; }
function findItem(id) { for (const ym in S.months) { const it = (S.months[ym] || []).find(x => x.id === id); if (it) return it; } return null; }
function submit(e) {
e.preventDefault();
const a = Math.round(parseFloat($("f-amount").value.replace(/\s/g, "").replace(",", ".")) * 100) / 100, d = $("f-date").value;
if (!(a > 0)) { $("f-err").textContent = "Indiquez un montant, par exemple 12,50."; return; }
if (!S.cat) { $("f-err").textContent = "Choisissez une catégorie."; return; }
if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { $("f-err").textContent = "Choisissez une date."; return; }
if (S.demo) { S.demo = false; S.months = {}; }
const it = {id: S.edit ? S.edit.id : Date.now().toString(36) + Math.random().toString(36).slice(2, 6), k:S.kind, d, t:$("f-label").value.trim(), c:S.cat, a};
if (S.kind === "p") it.p = S.edit ? !!S.edit.p : false;
const touched = new Set([ymOf(d)]);
if (S.edit) { const old = removeItem(S.edit.id); if (old) touched.add(old); }
(S.months[ymOf(d)] || (S.months[ymOf(d)] = [])).push(it);
touched.forEach(save);
S.ym = ymOf(d); S.tab = "month"; closeForm(); render();
}
/* ---------- gestes ---------- */
$("prev").onclick = () => { S.ym = shift(S.ym, S.tab === "year" ? -12 : -1); S.filter = null; render(); };
$("next").onclick = () => { S.ym = shift(S.ym, S.tab === "year" ? 12 : 1); S.filter = null; render(); };
$("tab-month").onclick = () => { S.tab = "month"; render(); };
$("tab-year").onclick = () => { S.tab = "year"; render(); };
$("add").onclick = () => openForm(null);
$("f-close").onclick = closeForm;
$("overlay").onclick = e => { if (e.target === $("overlay")) closeForm(); };
$("form").onsubmit = submit;
$("f-kind").onclick = e => { const b = e.target.closest("button"); if (b) { S.kind = b.dataset.k; drawForm(); } };
$("f-cats").onclick = e => { const b = e.target.closest("button"); if (b) { S.cat = b.dataset.c; drawForm(); } };
$("f-del").onclick = () => { if (S.edit) { const ym = removeItem(S.edit.id); if (ym) save(ym); } closeForm(); render(); };
function viewAction(e) {
const pay = e.target.closest("[data-pay]");
if (pay) { e.stopPropagation(); if (S.demo) return; const it = findItem(pay.dataset.pay); if (it) { it.p = true; save(ymOf(it.d)); render(); } return; }
if (e.target.closest("#clear")) { S.filter = null; render(); return; }
const cat = e.target.closest("[data-cat]");
if (cat) { S.filter = S.filter === cat.dataset.cat ? null : cat.dataset.cat; render(); return; }
const row = e.target.closest("[data-id]");
if (row && !S.demo && S.mode !== "loading") { const it = findItem(row.dataset.id); if (it) openForm(it); }
}
$("view").addEventListener("click", viewAction);
$("view").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-pay]")) { e.preventDefault(); viewAction(e); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("overlay").hidden) closeForm(); });
$("syncbar").onclick = e => {
if (e.target.id === "open-acct") { $("a-err").textContent = ""; $("acct-ov").hidden = false; setTimeout(() => $("a-email").focus(), 50); }
if (e.target.id === "logout") logout();
};
$("a-close").onclick = () => { $("acct-ov").hidden = true; };
async function doAuth(create) {
const email = $("a-email").value.trim(), pass = $("a-pass").value, err = $("a-err");
if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = "Indiquez votre e-mail."; return; }
if (pass.length < 6) { err.textContent = "Mot de passe : 6 caractères minimum."; return; }
err.textContent = create ? "Création du compte…" : "Connexion…";
$("a-login").disabled = $("a-signup").disabled = true;
try {
const res = await login(email, pass, create);
if (res === "confirm") err.textContent = "Compte créé. Ouvrez l'e-mail reçu, cliquez sur le lien de confirmation, puis revenez ici et touchez « Se connecter ».";
else { $("a-pass").value = ""; $("acct-ov").hidden = true; render(); }
} catch (e) { err.textContent = authMessage(e); }
$("a-login").disabled = $("a-signup").disabled = false;
}
$("acct-form").onsubmit = e => { e.preventDefault(); doAuth(false); };
$("a-signup").onclick = () => doAuth(true);
document.addEventListener("visibilitychange", () => { if (!document.hidden && sess && $("overlay").hidden) sync(); });
window.addEventListener("online", () => { if (sess) sync(); });
render(); boot();
</script>
</body>
</html>
